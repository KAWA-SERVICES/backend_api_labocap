# Reverse proxy de l'API — /etc/nginx/sites-available/api.caap.bj sur le serveur.
#
# Versionné ici (lot 9) pour que la configuration en place soit relisible et
# reproductible. Après modification sur le serveur : `nginx -t && systemctl
# reload nginx`. Le certificat est renouvelé par certbot (voir README.md).

# Les liens de facture envoyés par SMS portent un jeton qui vaut accès à la
# facture tant qu'il n'a pas expiré : il n'a rien à faire dans un journal que
# d'autres lisent. Le chemin est conservé, le jeton remplacé par « *** ».
# Au niveau http (ce fichier est inclus dans le bloc http de nginx.conf).
map $request_uri $uri_journalisee {
    ~^/f/[^/?]+(?<reste>.*)$                        /f/***$reste;
    ~^/api/v1/public/invoices/[^/?]+(?<reste>.*)$   /api/v1/public/invoices/***$reste;
    default                                          $request_uri;
}
# Format « combined » de nginx, l'URI remplacée par sa version masquée. Pas de
# Referer : une page ouverte depuis le PDF y renverrait l'adresse complète.
log_format sans_jeton '$remote_addr - $remote_user [$time_local] '
                      '"$request_method $uri_journalisee $server_protocol" $status $body_bytes_sent '
                      '"$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name api.caap.bj;
    access_log /var/log/nginx/access.log sans_jeton;
    # Tout en HTTPS, sauf le défi ACME de certbot.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.caap.bj;
    access_log /var/log/nginx/access.log sans_jeton;

    ssl_certificate     /etc/letsencrypt/live/api.caap.bj/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.caap.bj/privkey.pem;
    # TLS 1.2 minimum, suites modernes (profil « intermediate » de Mozilla).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:api:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # L'API pose déjà ses propres en-têtes (Spring Security) ; HSTS se pose
    # ici, nginx étant le point de terminaison TLS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Téléversements (clichés, documents) : aligné sur
    # spring.servlet.multipart.max-request-size.
    client_max_body_size 100m;

    # Génération de PDF et exports : plus long qu'un appel ordinaire.
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    # Signalisation des appels audio : WebSocket.
    location /ws/ {
        proxy_pass http://127.0.0.1:7001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:7001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # L'API (Tomcat, forward-headers native) ne croit ces en-têtes que
        # d'un proxy interne et en tire l'adresse du client, dont dépend la
        # limitation d'essais. $proxy_add_x_forwarded_for ajoute l'adresse
        # réelle à droite de ce que le client a pu écrire : c'est elle que
        # Tomcat retient.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
