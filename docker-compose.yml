services:
  # ─── Base de données PostgreSQL ────────────────────────────────────────────
  db:
    image: postgres:16
    container_name: labo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-labo_anapath}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans .env}
      # Port d'écoute interne de PostgreSQL (repris par pg_isready via $PGPORT)
      PGPORT: ${DB_PORT:-5432}
    volumes:
      - db-data:/var/lib/postgresql/data
      # Restauration AUTOMATIQUE du dump au tout premier démarrage (volume vide).
      # ⚠ Indispensable : Flyway est configuré baseline-version=50 et ne rejoue
      # pas V1→V50. Le dump doit contenir le schéma déjà migré jusqu'à V50.
      # Ne s'exécute QUE si db-data est vide. Adapte le nom du fichier si besoin.
      - ./backups/backup-2026-07-06-20-01-06.sql:/docker-entrypoint-initdb.d/01-restore.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-labo_anapath} -p ${DB_PORT:-5432}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Décommente pour exposer PostgreSQL à l'hôte (admin/psql). Sinon, garde-le
    # privé au réseau interne, seule l'API y accède.
    # ports:
    #   - "${DB_PORT:-5432}:${DB_PORT:-5432}"

  # ─── API Spring Boot ───────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: labo-anapath-api:1.0.0
    container_name: labo-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Heure du laboratoire pour tout le conteneur : les tâches planifiées
      # portent déjà leur fuseau, mais l'horodatage des journaux et des
      # fichiers de sauvegarde sortaient en UTC, deux heures plus tôt que ce
      # que lit l'équipe.
      TZ: Africa/Porto-Novo
      # Port d'écoute de l'application DANS le conteneur (server.port=${PORT}).
      # Repris tel quel par le mapping et le healthcheck plus bas : ces trois
      # emplacements doivent rester alignés, sous peine d'un conteneur déclaré
      # sain mais injoignable.
      PORT: ${APP_PORT:-7001}
      # La base est jointe par le nom de service "db" sur le réseau interne
      DB_URL: jdbc:postgresql://db:${DB_PORT:-5432}/${DB_NAME:-labo_anapath}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans .env}
      # Sauvegarde : `pg_dump` s'adresse au serveur par le réseau, comme
      # l'application. DB_HOST vaut le nom du service, pas localhost.
      # Spring lit `app.backup.*` : le préfixe APP_ est nécessaire, une
      # variable nommée BACKUP_DIR ne serait jamais reliée à la propriété.
      APP_BACKUP_DIR: /var/lib/labo/backups
      APP_BACKUP_COMMAND: pg_dump -h db -p ${DB_PORT:-5432} -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-labo_anapath}
      APP_BACKUP_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans .env}
      APP_BACKUP_KEEP: ${BACKUP_KEEP:-30}
      # Chaque export est chiffré (age) contre cette clé publique, puis copié
      # dans un seau S3 réservé aux sauvegardes — distinct de celui des
      # fichiers, avec des clés en écriture seule. Sans clé publique, la
      # sauvegarde est REFUSÉE en production et une alerte part : voir
      # docs/restauration.md pour préparer la clé et le seau.
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-eu-west-3}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      # Prévenu, avec les administrateurs (réglage admin_mails), de tout échec.
      BACKUP_ALERT_EMAIL: ${BACKUP_ALERT_EMAIL:-}
      # Biologie clinique : "true" pour un laboratoire qui la pratique.
      MODULE_BIOLOGY: ${MODULE_BIOLOGY:-false}
      # Supervision (docs/supervision.md). ALERT_EMAIL : le prestataire, qui
      # reçoit les alertes techniques. MANAGEMENT_METRICS_EXPOSED : "true"
      # seulement avec docker-compose.supervision.yml en face ; les métriques
      # ne sortent jamais par nginx.
      ALERT_EMAIL: ${ALERT_EMAIL:-}
      MANAGEMENT_METRICS_EXPOSED: ${MANAGEMENT_METRICS_EXPOSED:-false}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans .env}
      # Les trois durées de session. Elles valaient ici 24 h et 7 jours, ce qui
      # écrasait sans le dire la politique écrite dans application.yml — la
      # fenêtre de quinze minutes qu'il documentait n'a donc jamais existé en
      # production, et un poste laissé ouvert au comptoir restait utilisable
      # une semaine.
      #
      # Le jeton d'accès doit rester bien plus court que la fenêtre : c'est son
      # expiration qui déclenche le rafraîchissement, donc qui fait glisser la
      # fenêtre sur l'activité réelle. À 24 h il ne s'en produisait aucun, et la
      # durée du jeton de rafraîchissement ne décidait plus de rien.
      JWT_EXPIRATION: ${JWT_EXPIRATION:-300000}
      # Trente minutes de silence ferment la session — une heure pour un
      # médecin, qui quitte son écran pour lire une lame et y revient.
      JWT_REFRESH: ${JWT_REFRESH:-1800000}
      JWT_REFRESH_MEDECIN: ${JWT_REFRESH_MEDECIN:-3600000}
      # Adresse du front : destination du lien de réinitialisation du mot de passe
      # Obligatoires en production (`:?` : compose refuse de démarrer si la
      # variable manque dans .env). Un défaut « localhost » ferait partir des
      # liens inutilisables dans les courriels et les SMS, sans aucune erreur.
      APP_FRONT_URL: ${APP_FRONT_URL:?APP_FRONT_URL manquant dans .env (adresse du front, sans / final)}
      # Origines frontend autorisées par CORS (lues par CorsConfig.java au runtime)
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:?APP_CORS_ALLOWED_ORIGINS manquant dans .env (origines du front)}
      # Adresse par laquelle un client joint l'API depuis son téléphone :
      # préfixe du lien de téléchargement envoyé par SMS.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL manquant dans .env (adresse publique de l'API)}
      INVOICE_SHARE_LINK_TTL_DAYS: ${INVOICE_SHARE_LINK_TTL_DAYS:-60}
      # Attribut Secure des cookies d'auth. TOUJOURS true en prod HTTPS ; à mettre
      # à false UNIQUEMENT sur un serveur servi en HTTP clair (sinon le navigateur
      # rejette le cookie et l'utilisateur est renvoyé sur /login).
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-true}
      # Domaine des cookies d'authentification. Vide par défaut : le cookie est
      # alors host-only, donc réservé au domaine de l'API.
      #
      # ⚠ À renseigner dès que le front n'est PAS sur le même hôte que l'API.
      # Avec l'API sur api.exemple.fr et le front sur app.exemple.fr, le cookie
      # posé par l'API n'atteint jamais le front : sa garde de routes ne voit
      # aucun jeton et renvoie sur /login en boucle, alors que la connexion a
      # réussi. Poser « .exemple.fr », avec le point initial.
      #
      # Inutile en développement : localhost:3001 et localhost:8080 partagent
      # déjà leurs cookies, les ports n'entrant pas dans leur portée — ce qui
      # rend le défaut invisible hors production.
      APP_COOKIE_DOMAIN: ${APP_COOKIE_DOMAIN:-}
      # DEV UNIQUEMENT : affiche le code OTP 2FA en clair dans les logs quand
      # l'envoi d'e-mails est indisponible. NE JAMAIS activer en production.
      APP_OTP_LOG_PLAINTEXT: ${APP_OTP_LOG_PLAINTEXT:-false}
      # Stockage des fichiers dans le conteneur → volume persistant "storage"
      STORAGE_PATH: /var/lib/labo/storage
      # Chiffrement des fichiers stockés. Ce qu'il protège : un volume emporté,
      # un disque de serveur éteint, une sauvegarde de fichiers dérobée. Ce
      # qu'il ne protège pas : un serveur en fonctionnement, où la clé se lit
      # dans l'environnement comme l'application le fait.
      #
      # ⚠ La clé n'a PAS de valeur par défaut, et c'est voulu. Une clé de
      # repli ferait démarrer un serveur mal configuré en chiffrant avec une
      # clé publique — pire que pas de chiffrement, puisqu'on le croirait actif.
      STORAGE_ENCRYPTION_ENABLED: ${STORAGE_ENCRYPTION_ENABLED:-false}
      STORAGE_ENCRYPTION_KEY: ${STORAGE_ENCRYPTION_KEY:-}
      # Clé des secrets courts à remontrer (code d'enrôlement mobile). Vide,
      # la fonction s'éteint sans bruit — voir app.secrets.key.
      SECRETS_KEY: ${SECRETS_KEY:-}
      # ─── Stockage des fichiers sur S3 ──────────────────────────────────
      #
      # Désactivé par défaut : les fichiers restent sur le volume du serveur.
      #
      # Actif : on écrit dans le seau, on lit d'abord le seau puis le volume.
      # Ce repli rend lisibles les clichés d'avant la bascule sans migration
      # en bloc — et permet de revenir en arrière en retirant S3_ENABLED.
      #
      # ⚠ Le volume « storage » reste nécessaire tant qu'il détient des
      # fichiers. Le retirer avant d'avoir tout migré rendrait les anciens
      # dossiers introuvables, sans message d'erreur au démarrage.
      #
      # AWS ne reçoit que du chiffré : la clé ci-dessus reste indispensable.
      S3_ENABLED: ${S3_ENABLED:-false}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-eu-west-3}
      S3_PREFIX: ${S3_PREFIX:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      # Notifications hors-app. Le compte de service Firebase est monté en
      # lecture seule plutôt que passé par l'environnement : le JSON fait deux
      # kilo-octets et se retrouverait entier dans « docker inspect ».
      #
      # Vide par défaut, et c'est voulu : sans clé le serveur démarre et sert
      # normalement, muet. Renseigner PUSH_CREDENTIALS_FILE dans .env une fois
      # le fichier déposé dans ./secrets/.
      PUSH_CREDENTIALS_FILE: ${PUSH_CREDENTIALS_FILE:-}
      # Appels audio. Sans relais configuré, l'application le dit à l'écran
      # plutôt que de laisser l'appel échouer sans explication : sur données
      # mobiles, la connexion directe passe rarement.
      TURN_URL: ${TURN_URL:-}
      TURN_SECRET: ${TURN_SECRET:-}
      # SMTP
      # ─── Facturation normalisée e-MCF / DGI ────────────────────────────
      #
      # Désactivée par défaut. Sans clé, aucune facture ne part à la DGI —
      # et l'écran le dit plutôt que d'échouer en silence.
      #
      # ⚠ La clé porte son usage dans son préfixe :
      #   fni_test_ → bac à sable, rien n'atteint l'administration
      #   fni_live_ → factures normalisées RÉELLES, avec valeur fiscale
      #
      # Une facture normalisée émise par erreur n'est pas annulable d'un
      # clic : c'est un document fiscal, et le laboratoire en répond.
      FLUIDINVOICE_ENABLED: ${FLUIDINVOICE_ENABLED:-false}
      FLUIDINVOICE_BASE_URL: ${FLUIDINVOICE_BASE_URL:-https://invoice.fluidpay.link/v1}
      FLUIDINVOICE_API_KEY: ${FLUIDINVOICE_API_KEY:-}
      # Nom de l'opérateur porté sur la facture normalisée.
      FLUIDINVOICE_OPERATOR_NAME: ${FLUIDINVOICE_OPERATOR_NAME:-CENTRE ADECHINA ANATOMIE PATHOLOGIQUE}
      # A = exonéré. La classification fiscale engage le contribuable (art. 168 CGI).
      FLUIDINVOICE_TAX_GROUP: ${FLUIDINVOICE_TAX_GROUP:-A}
      # Courriel : codes de connexion et liens de réinitialisation en dépendent.
      # Pas de défaut : un serveur SMTP de démonstration en production
      # enverrait les codes nulle part, sans erreur au démarrage.
      MAIL_HOST: ${MAIL_HOST:?MAIL_HOST manquant dans .env}
      MAIL_PORT: ${MAIL_PORT:?MAIL_PORT manquant dans .env}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM manquant dans .env}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Labo AnaPath}
      # ─── SMS par FluidPay ───────────────────────────────────────────────
      # Sans clé d'API ni clé de chiffrement, repli sur OurVoice (setting_apps).
      FLUIDPAY_SMS_ENABLED: ${FLUIDPAY_SMS_ENABLED:-true}
      FLUIDPAY_SMS_BASE_URL: ${FLUIDPAY_SMS_BASE_URL:-https://app.fluidpay.link}
      FLUIDPAY_SMS_API_KEY: ${FLUIDPAY_SMS_API_KEY:-}
      FLUIDPAY_SMS_ENCRYPTION_KEY: ${FLUIDPAY_SMS_ENCRYPTION_KEY:-}
      FLUIDPAY_SMS_PROVIDER: ${FLUIDPAY_SMS_PROVIDER:-lafricamobile}
      FLUIDPAY_SMS_SENDER: ${FLUIDPAY_SMS_SENDER:-}
      # ─── Journal applicatif ─────────────────────────────────────────────
      # Sur un volume : écrit dans le conteneur, il disparaissait à chaque
      # redéploiement, et avec lui toute trace d'un incident.
      LOG_FILE: /var/lib/labo/logs/labo-api.log
      LOG_MAX_FILE_SIZE: ${LOG_MAX_FILE_SIZE:-10MB}
      LOG_MAX_HISTORY: ${LOG_MAX_HISTORY:-30}
      LOG_TOTAL_SIZE_CAP: ${LOG_TOTAL_SIZE_CAP:-1GB}
    volumes:
      - storage:/var/lib/labo/storage
      # Les secrets en fichier — aujourd'hui le seul compte de service
      # Firebase. En lecture seule : l'application n'a aucune raison d'y
      # écrire, et le lui interdire ferme une porte de plus.
      - ./secrets:/var/lib/labo/secrets:ro
      # Les sauvegardes doivent survivre au redéploiement : sans volume,
      # elles vivaient dans la couche éphémère du conteneur.
      - backups:/var/lib/labo/backups
      - logs:/var/lib/labo/logs
    ports:
      # hôte:conteneur — API_PORT règle le port publié, APP_PORT celui écouté.
      # Publié sur 127.0.0.1 uniquement : l'accès public passe par le reverse
      # proxy nginx (api.caap.bj) ; le port n'est pas exposé sur Internet.
      # nginx doit poser `proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;`
      # et `X-Forwarded-Proto $scheme` : l'API (Tomcat, forward-headers native)
      # ne lit ces en-têtes que d'un proxy interne et en tire l'adresse du client,
      # dont dépend la limitation d'essais. Configuration à versionner (lot 9).
      - "127.0.0.1:${API_PORT:-7001}:${APP_PORT:-7001}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${APP_PORT:-7001}/actuator/health | grep -q UP || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ─── Relais de voix pour les appels (coturn) ──────────────────────────────
  turn:
    image: coturn/coturn:4.6
    container_name: labo-turn
    restart: unless-stopped
    # Réseau de l'hôte, et non un réseau Docker : coturn doit annoncer aux
    # téléphones l'adresse publique à laquelle les joindre. Derrière une
    # traduction d'adresses Docker, il annoncerait une adresse interne — les
    # appels s'établiraient puis resteraient muets, ce qui est le symptôme le
    # plus long à diagnostiquer. C'est aussi ce qui évite de publier les
    # quarante ports UDP de la plage de relais un par un.
    network_mode: host
    volumes:
      - ./relais/turnserver.conf:/etc/coturn/turnserver.conf:ro
    # Le secret et l'adresse viennent de .env, jamais du fichier de
    # configuration : celui-ci est versionné, et le déploiement fait
    # « git reset --hard ». Inscrits dedans, ils seraient effacés à chaque
    # mise en production.
    #
    # Sans TURN_IP, coturn se replie sur la boucle locale : il démarre, ne
    # sert personne, et l'API annonce « relais non configuré » — ce que
    # l'application dit à l'écran. Mieux qu'un conteneur qui refuse de
    # partir et fait échouer tout le déploiement.
    command:
      - "-c"
      - "/etc/coturn/turnserver.conf"
      - "--static-auth-secret=${TURN_SECRET:-inactif}"
      - "--listening-ip=${TURN_IP:-127.0.0.1}"
      - "--relay-ip=${TURN_IP:-127.0.0.1}"
      # Le journal sur la sortie standard, pour que « docker logs labo-turn »
      # montre quelque chose. Par défaut coturn écrit dans un fichier qui,
      # dans cette image, n'existe nulle part : le conteneur tourne, se dit
      # sain, et ne raconte rien. Un relais qu'on ne peut pas interroger est
      # un relais qu'on ne peut pas réparer.
      - "--log-file=stdout"
      - "--simple-log"

volumes:
  backups:
  db-data:
  logs:
  storage:
