name: Deploy Spring Boot Application

# Même mécanique que fluidpay et labsys_front : le serveur tire main et
# reconstruit l'image par docker compose (le Dockerfile compile le jar sans
# les tests — ils viennent de tourner dans le job `tests`).
on:
  push:
    branches:
      - main
  # Redéployer main à la main (secret changé, image à reconstruire…).
  workflow_dispatch:
    inputs:
      sans_tests:
        description: "Sauter la suite de tests (main n'a pas changé, seule la configuration serveur a bougé)"
        type: boolean
        default: false

# Deux merges rapprochés lanceraient deux `compose up --build` sur le même
# serveur : on les met en file sans annuler celui qui tourne (africauto).
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  tests:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.sans_tests }}
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: tests
    # Un merge sur main exige les tests ; un redéploiement manuel peut les
    # sauter si main n'a pas changé (needs.tests.result vaut alors « skipped »).
    if: ${{ always() && (needs.tests.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.tests.result == 'skipped')) }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Déploiement (git pull + docker compose rebuild)
        uses: appleboy/ssh-action@v1.2.5
        # Les variables du .env serveur peuvent venir d'ici (même mécanique que
        # africauto-dashboard) : le script ci-dessous n'écrit une clé QUE si
        # .env ne l'a pas déjà et que la valeur est non vide. Une valeur posée
        # à la main sur le serveur n'est jamais écrasée. Les adresses sont des
        # VARIABLES de dépôt (lisibles dans l'interface), le reste des secrets.
        env:
          APP_FRONT_URL: ${{ vars.APP_FRONT_URL }}
          APP_CORS_ALLOWED_ORIGINS: ${{ vars.APP_CORS_ALLOWED_ORIGINS }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          LOG_MAX_HISTORY: ${{ vars.LOG_MAX_HISTORY }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          # Mail : secrets MAIL_* communs à tous les projets. Eux REMPLACENT la
          # ligne du .env (GitHub fait foi), contrairement au reste.
          MAIL_FROM: ${{ secrets.MAIL_FROM_ADDRESS }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          SECRETS_KEY: ${{ secrets.SECRETS_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
          BACKUP_ALERT_EMAIL: ${{ secrets.BACKUP_ALERT_EMAIL }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_REGION: ${{ secrets.BACKUP_S3_REGION }}
          BACKUP_S3_ACCESS_KEY: ${{ secrets.BACKUP_S3_ACCESS_KEY }}
          BACKUP_S3_SECRET_KEY: ${{ secrets.BACKUP_S3_SECRET_KEY }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          # SMS du laboratoire, via BulkPayment (LAfricaMobile). Adresse,
          # opérateur et expéditeur en variables ; clé et clé de chiffrement
          # en secrets.
          FLUIDPAY_SMS_BASE_URL: ${{ vars.FLUIDPAY_SMS_BASE_URL }}
          FLUIDPAY_SMS_PROVIDER: ${{ vars.FLUIDPAY_SMS_PROVIDER }}
          FLUIDPAY_SMS_SENDER: ${{ vars.FLUIDPAY_SMS_SENDER }}
          FLUIDPAY_SMS_API_KEY: ${{ secrets.FLUIDPAY_SMS_API_KEY }}
          FLUIDPAY_SMS_ENCRYPTION_KEY: ${{ secrets.FLUIDPAY_SMS_ENCRYPTION_KEY }}
          # Appels « résultat disponible » par FluidChat : adresse et clé en secrets.
          FLUIDCHAT_BASE_URL: ${{ secrets.FLUIDCHAT_BASE_URL }}
          FLUIDCHAT_API_KEY: ${{ secrets.FLUIDCHAT_API_KEY }}
        with:
          envs: APP_FRONT_URL,APP_CORS_ALLOWED_ORIGINS,PUBLIC_BASE_URL,LOG_MAX_HISTORY,MAIL_HOST,MAIL_PORT,MAIL_FROM,MAIL_FROM_NAME,MAIL_USERNAME,MAIL_PASSWORD,SECRETS_KEY,ALERT_EMAIL,BACKUP_AGE_RECIPIENT,BACKUP_ALERT_EMAIL,BACKUP_S3_BUCKET,BACKUP_S3_REGION,BACKUP_S3_ACCESS_KEY,BACKUP_S3_SECRET_KEY,BACKUP_S3_ENDPOINT,FLUIDPAY_SMS_BASE_URL,FLUIDPAY_SMS_PROVIDER,FLUIDPAY_SMS_SENDER,FLUIDPAY_SMS_API_KEY,FLUIDPAY_SMS_ENCRYPTION_KEY,FLUIDCHAT_BASE_URL,FLUIDCHAT_API_KEY
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 20m        # le rebuild Maven dans Docker peut durer plusieurs minutes
          # Sans cela, une commande qui échoue laisse le script continuer et le
          # job passe au vert : on croirait avoir déployé (labsys_front).
          script_stop: true
          script: |
            set -euo pipefail
            # Les erreurs du serveur (shell, compose) doivent apparaître dans le journal.
            exec 2>&1
            echo "→ Shell : $0, utilisateur : $(id -un)"
            cd ${{ secrets.SERVER_PROJECT_PATH }}

            echo "→ Récupération du code (main)"
            git fetch --prune origin main
            git reset --hard origin/main

            echo "→ Complément du .env depuis GitHub (sans écraser l'existant)"
            [ -f .env ] || { echo "::error::.env absent dans $(pwd)"; exit 1; }
            [ -z "$(tail -c1 .env)" ] || echo >> .env
            ls -l .env
            ajouter_si_absent() { # clé : écrite seulement si .env ne l'a pas et que GitHub la fournit
              k="$1"
              # Pas de ${!k} : le shell de connexion n'est pas forcément bash.
              eval "v=\${$k:-}"
              [ "$v" = "A_RENSEIGNER" ] && v=""   # secret créé, valeur pas encore saisie
              if grep -qE "^$k=" .env; then return 0; fi
              if [ -z "$v" ]; then echo "::warning::$k : ni dans le .env du serveur, ni dans GitHub"; return 0; fi
              printf '%s=%s\n' "$k" "$v" >> .env
              echo "$k écrite dans .env depuis GitHub"
            }
            remplacer() { # clé : la ligne est réécrite si GitHub fournit une valeur
              k="$1"
              eval "v=\${$k:-}"
              [ "$v" = "A_RENSEIGNER" ] && { echo "::warning::$k : secret créé mais valeur pas encore saisie dans GitHub"; return 0; }
              [ -n "$v" ] || return 0
              { grep -v "^$k=" .env || true; printf '%s=%s\n' "$k" "$v"; } > .env.tmp
              cat .env.tmp > .env && rm -f .env.tmp
              echo "$k mise à jour dans .env depuis GitHub"
            }
            # Remplacées, pas seulement ajoutées : le passage de FluidPay à
            # BulkPayment doit écraser l'ancienne adresse et l'ancienne clé.
            for k in MAIL_HOST MAIL_PORT MAIL_FROM MAIL_FROM_NAME MAIL_USERNAME MAIL_PASSWORD \
                     FLUIDPAY_SMS_BASE_URL FLUIDPAY_SMS_PROVIDER FLUIDPAY_SMS_SENDER \
                     FLUIDPAY_SMS_API_KEY FLUIDPAY_SMS_ENCRYPTION_KEY \
                     FLUIDCHAT_BASE_URL FLUIDCHAT_API_KEY; do
              remplacer "$k"
            done
            for k in APP_FRONT_URL APP_CORS_ALLOWED_ORIGINS PUBLIC_BASE_URL LOG_MAX_HISTORY \
                     SECRETS_KEY ALERT_EMAIL BACKUP_AGE_RECIPIENT BACKUP_ALERT_EMAIL \
                     BACKUP_S3_BUCKET BACKUP_S3_REGION BACKUP_S3_ACCESS_KEY BACKUP_S3_SECRET_KEY BACKUP_S3_ENDPOINT; do
              ajouter_si_absent "$k"
            done

            # Une variable obligatoire manquante arrête compose avant tout
            # rebuild : le dire clairement plutôt que « conteneur non sain ».
            if ! docker compose config -q; then
              echo "::error::Configuration compose refusée : variable obligatoire absente du .env (voir ci-dessus)."
              exit 1
            fi

            # L'image en place devient `previous` : c'est elle qu'on relance
            # si la nouvelle ne devient pas saine.
            docker image tag labo-anapath-api:1.0.0 labo-anapath-api:previous 2>/dev/null || true

            echo "→ Reconstruction de l'image API + redémarrage"
            # --wait attend le healthcheck du compose (/actuator/health) et
            # échoue si le conteneur ne devient pas sain.
            if ! docker compose up -d --build --wait api; then
              echo "Conteneur non sain — logs, puis retour à l'image précédente :"
              docker compose logs --tail=80 api
              docker image tag labo-anapath-api:previous labo-anapath-api:1.0.0
              docker compose up -d --no-build --force-recreate api
              exit 1
            fi
            echo "Déploiement OK (labo-api sain)"
